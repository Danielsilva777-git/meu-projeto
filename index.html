<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle financerio</title>
    <link rel="stylesheet" href="style03.css">
</head>
 
<body>
     <div class="container">
         <div class="controle">
                <h1>💰 Controle Financeiro</h1>
             
                <div class="linha">
                     <select id="movimentação">
                         <option value="entrada">💰 Entradas</option>
                         <option value="saida">💸 Saidas</option>
                     </select>
                </div>

               <div class="linha">
                    <select  id="valores">
                         <option value="">📂 Aguarde...</option>
                    </select>
               </div>
               <div class="linha"><input type="number" placeholder="💲 0,00" id="input"></div>

               <div class="botao"><button id="btn-adicionar">Adicionar</button></div>
        
          </div>
         
         <div class="tela" id="movimentções">
               <h2>💸 Movimentações</h2>
               <div class="divs"></div> 
               <div class="resultado"></div>
          </div>
     </div>
            
    <script src="script.js"></script>
</body>
</html>
